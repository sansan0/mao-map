name: 构建与发布

on:
  push:
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  ARTIFACT_PREFIX: mao-map

jobs:
  build-check:
    name: 构建检查 (${{ matrix.os }})
    if: "!startsWith(github.ref, 'refs/tags/v')"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: 校验应用版本
        run: npm run check:version

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: 安装前端依赖
        run: npm ci

      - name: 验证共享界面交互
        if: runner.os == 'Windows'
        run: npm test

      - name: 构建前端
        run: npm run build

      - name: 检查 Rust 后端 (Tauri)
        working-directory: src-tauri
        run: cargo check

  release-bundles:
    name: 发布打包 (${{ matrix.target_name }})
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target_name: windows-x64
          - os: macos-14
            target_name: macos-universal
          - os: ubuntu-latest
            target_name: android

    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        if: matrix.target_name == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 安装 Android SDK
        if: matrix.target_name == 'android'
        uses: android-actions/setup-android@v3

      - name: 安装 Android SDK 组件
        if: matrix.target_name == 'android'
        shell: bash
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> $GITHUB_ENV

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: 校验应用版本与发布标签
        run: npm run check:version

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: 添加 macOS Rust 目标
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: 添加 Android Rust 目标
        if: matrix.target_name == 'android'
        run: rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

      - name: 安装前端依赖
        run: npm ci

      - name: 验证共享界面交互
        if: runner.os == 'Windows'
        run: npm test

      - name: 准备 Android 签名密钥
        if: matrix.target_name == 'android'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_STORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing Android signing secret: $name"
              exit 1
            fi
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > src-tauri/gen/android/app/maomap-release.jks
          cat > src-tauri/gen/android/app/keystore.properties << EOF
          storeFile=maomap-release.jks
          storePassword=$ANDROID_STORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: 构建 Tauri 安装包 (Windows)
        if: runner.os == 'Windows'
        run: npm run tauri -- build --bundles nsis

      - name: 构建 Tauri 安装包 (macOS)
        if: runner.os == 'macOS'
        run: npm run tauri -- build --target universal-apple-darwin --bundles dmg

      - name: 构建 Android APK
        if: matrix.target_name == 'android'
        run: npm run tauri -- android build --apk --ci

      - name: 整理 Windows 产物
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          $version = $env:GITHUB_REF_NAME
          $prefix = $env:ARTIFACT_PREFIX
          $appVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version

          # NSIS 安装包
          $nsis = @(Get-ChildItem -Path 'src-tauri/target/release/bundle/nsis' -Filter "*_${appVersion}_x64-setup.exe" -File)
          if ($nsis.Count -ne 1) { throw "Expected one Windows installer for $appVersion, found $($nsis.Count)" }
          $nsisName = "$prefix-$version-Windows-setup.exe"
          Copy-Item -LiteralPath $nsis[0].FullName -Destination (Join-Path release-assets $nsisName)
          if (Test-Path -LiteralPath "$($nsis[0].FullName).sig") {
            Copy-Item -LiteralPath "$($nsis[0].FullName).sig" -Destination (Join-Path release-assets "$nsisName.sig")
          }

          # 便携版 zip
          $exe = 'src-tauri/target/release/mao-map.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw 'Windows application executable is missing' }
          Compress-Archive -LiteralPath $exe -DestinationPath "release-assets\$prefix-$version-Windows-Portable.zip" -Force

      - name: 整理 macOS 产物
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p release-assets
          VERSION="${GITHUB_REF_NAME}"
          PREFIX="${ARTIFACT_PREFIX}"
          APP_VERSION=$(node -p "require('./package.json').version")

          shopt -s nullglob
          DMGS=(src-tauri/target/universal-apple-darwin/release/bundle/dmg/*_"${APP_VERSION}"_universal.dmg)
          [ "${#DMGS[@]}" -eq 1 ] || { echo "Expected one macOS installer for ${APP_VERSION}"; exit 1; }
          DMG="${DMGS[0]}"
          DMG_NAME="${PREFIX}-${VERSION}-macOS.dmg"
          cp "$DMG" "release-assets/$DMG_NAME"
          [ -f "$DMG.sig" ] && cp "$DMG.sig" "release-assets/$DMG_NAME.sig" || true

      - name: 整理 Android 产物
        if: matrix.target_name == 'android'
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p release-assets
          VERSION="${GITHUB_REF_NAME}"
          PREFIX="${ARTIFACT_PREFIX}"

          APK="src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$APK"
          cp "$APK" "release-assets/${PREFIX}-${VERSION}-Android.apk"

      - name: 上传矩阵构建产物
        uses: actions/upload-artifact@v4
        with:
          name: 构建产物-${{ matrix.target_name }}
          path: release-assets/*
          if-no-files-found: error

  publish-release:
    name: 发布 GitHub Release 资源
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    needs: release-bundles

    steps:
      - name: 下载所有构建产物
        uses: actions/download-artifact@v4
        with:
          path: merged-assets

      - name: 汇总产物文件
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p release-assets
          find merged-assets -maxdepth 3 -type f -exec cp {} release-assets/ \;
          for suffix in Windows-setup.exe Windows-Portable.zip macOS.dmg Android.apk; do
            test -s "release-assets/${ARTIFACT_PREFIX}-${GITHUB_REF_NAME}-${suffix}"
          done
          ls -la release-assets

      - name: 上传产物到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          prerelease: false
          files: release-assets/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
